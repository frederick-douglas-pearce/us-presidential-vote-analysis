# Deploy the public dashboard to App Engine standard (E9-S2, #277 / D071).
#
# Owner-run and keyless: Workload Identity Federation into the dashboard's own project
# (`uspv-explore`), through a pool that lives in that project, so nothing about the API's
# deploy identity can reach it. Gated behind the `production` GitHub Environment, the same
# human gate the API deploy uses (deploy.yml).
#
# The order is the rollback story, so keep it:
#   1. deploy the new version WITHOUT promoting it;
#   2. probe it on its own version host (<version>-dot-<app host>);
#   3. move all traffic to it;
#   4. probe the public hostname;
#   5. only then delete every other version (min_instances and max_instances are
#      per-version settings, so a leftover version keeps a pinned instance running) and
#      assert exactly one version remains.
# A failure or cancellation in 2-4 moves traffic back to the previous version and deletes
# the new one, so a bad deploy costs a failed run, not an outage. Each probe carries its
# own step timeout, so a hung probe fails its step (and rolls back) well inside the job's
# timeout rather than being cancelled with it. A failure in 5 leaves the new version
# serving and an old one behind; the job fails and says which versions to delete.
#
# Environment-specific values come from repo Variables (runbook: docs/deploy-dashboard.md):
#   EXPLORE_GCP_PROJECT_ID, EXPLORE_WIF_PROVIDER, EXPLORE_DEPLOY_SA, EXPLORE_HOSTNAME
#
# Trigger is workflow_dispatch ONLY — never pull_request (a forked PR must not deploy).

name: Deploy dashboard (App Engine)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy (audit note)"
        required: false
        default: "manual deploy"

permissions:
  contents: read   # checkout
  id-token: write  # mint the WIF OIDC token

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false  # never cancel an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Build (≈6 min measured) + two probes (≤ 8 min each, their step timeouts) + the rest.
    timeout-minutes: 40
    environment: production
    env:
      PROJECT: ${{ vars.EXPLORE_GCP_PROJECT_ID }}
      EXPLORE_HOST: ${{ vars.EXPLORE_HOSTNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # The runtime's whole dependency closure is the lock's `dashboard` group. Exported,
      # never committed, so it cannot drift from uv.lock. --no-emit-project leaves the
      # usvote package itself out, which is what makes D070(b) physical in production:
      # the deployed app has no usvote to import.
      - name: Export requirements.txt from the lock
        run: |
          set -euo pipefail
          uv export --frozen --only-group dashboard --no-emit-project \
            -o dashboard/requirements.txt
          if grep -Eiq '^(usvote|-e |\.)' dashboard/requirements.txt; then
            echo "::error::the exported requirements would install usvote or a local path"
            exit 1
          fi
          grep -Eq '^dash==' dashboard/requirements.txt
          grep -Eq '^gunicorn==' dashboard/requirements.txt

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.EXPLORE_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.EXPLORE_WIF_PROVIDER }}
          service_account: ${{ vars.EXPLORE_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Record the serving version
        id: before
        run: |
          set -euo pipefail
          PREVIOUS=$(gcloud app versions list --project="$PROJECT" --service=default \
            --filter='traffic_split>0' --format='value(id)' | head -n1)
          APP_HOST=$(gcloud app describe --project="$PROJECT" --format='value(defaultHostname)')
          # Unique per run *attempt*: "Re-run jobs" keeps the run number and the SHA, and
          # only the attempt changes. Deploying onto an existing version would replace it
          # in place, before any probe, so an existing id is refused outright.
          VERSION="v-${GITHUB_SHA::12}-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          if gcloud app versions describe "$VERSION" --project="$PROJECT" --service=default >/dev/null 2>&1; then
            echo "::error::version ${VERSION} already exists; refusing to deploy over it"
            exit 1
          fi
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "app_host=${APP_HOST}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "serving: ${PREVIOUS:-none}; deploying: ${VERSION}"

      - name: Deploy without promoting
        id: deploy
        env:
          VERSION: ${{ steps.before.outputs.version }}
        run: |
          set -euo pipefail
          gcloud app deploy dashboard/app.yaml --project="$PROJECT" \
            --version="$VERSION" --no-promote --quiet

      # scripts/probe_dashboard.sh says what "serving" means: the page shell plus page
      # content carrying the API's live snapshot version (the degraded page is a 200 too).
      - name: Probe the new version on its own host
        id: probe_version
        timeout-minutes: 8
        env:
          VERSION: ${{ steps.before.outputs.version }}
          APP_HOST: ${{ steps.before.outputs.app_host }}
        run: scripts/probe_dashboard.sh "https://${VERSION}-dot-${APP_HOST}" "$EXPLORE_HOST"

      - name: Move all traffic to the new version
        id: traffic
        env:
          VERSION: ${{ steps.before.outputs.version }}
        run: |
          set -euo pipefail
          gcloud app services set-traffic default --project="$PROJECT" \
            --splits="${VERSION}=1" --quiet

      - name: Probe the public hostname
        id: probe_public
        timeout-minutes: 8
        run: scripts/probe_dashboard.sh "https://${EXPLORE_HOST}" "$EXPLORE_HOST"

      - name: The vendor host redirects to the public hostname
        id: probe_redirect
        timeout-minutes: 2
        env:
          APP_HOST: ${{ steps.before.outputs.app_host }}
        run: |
          set -euo pipefail
          loc=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "https://${APP_HOST}/") || loc="curl failed"
          [ "$loc" = "301 https://${EXPLORE_HOST}/" ] || { echo "::error::https://${APP_HOST}/ answered '${loc}'"; exit 1; }
          echo "  ✓ ${APP_HOST} → ${EXPLORE_HOST}"

      # Runs when anything from the deploy through the redirect probe failed, timed out
      # or was cancelled — never after the probes all passed (a cleanup failure is below).
      - name: Roll back
        if: ${{ (failure() || cancelled()) && steps.before.outcome == 'success' && steps.probe_redirect.outcome != 'success' }}
        env:
          VERSION: ${{ steps.before.outputs.version }}
          PREVIOUS: ${{ steps.before.outputs.previous }}
        run: |
          set -uo pipefail
          rc=0
          exists() { gcloud app versions describe "$1" --project="$PROJECT" --service=default >/dev/null 2>&1; }
          if ! exists "$VERSION"; then
            echo "version ${VERSION} was never created; nothing to roll back"
            exit 0
          fi
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "$VERSION" ]; then
            echo "::error::no previous version to restore; ${VERSION} is left in place — check it and delete it by hand if it is not serving (docs/deploy-dashboard.md §10)"
            exit 1
          fi
          gcloud app services set-traffic default --project="$PROJECT" \
            --splits="${PREVIOUS}=1" --quiet || rc=1
          if [ "$rc" -eq 0 ]; then
            gcloud app versions delete "$VERSION" --project="$PROJECT" --service=default --quiet || rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::error::deploy of ${VERSION} failed; rolled back to ${PREVIOUS} and deleted ${VERSION}"
          else
            echo "::error::ROLLBACK FAILED: traffic may still be on ${VERSION}, and it may still exist — restore ${PREVIOUS} by hand (docs/deploy-dashboard.md §10)"
          fi
          exit "$rc"

      - name: Delete every other version
        id: cleanup
        env:
          VERSION: ${{ steps.before.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            others=$(gcloud app versions list --project="$PROJECT" --service=default \
              --format='value(id)' | grep -vx "$VERSION" || true)
            [ -z "$others" ] && break
            # shellcheck disable=SC2086
            gcloud app versions delete $others --project="$PROJECT" --service=default --quiet \
              && break || sleep 15
          done
          remaining=$(gcloud app versions list --project="$PROJECT" --service=default --format='value(id)')
          if [ "$remaining" != "$VERSION" ]; then
            echo "::error::expected exactly one version (${VERSION}); found: ${remaining//$'\n'/, }"
            exit 1
          fi
          echo "  ✓ one version: ${VERSION}"

      # The new version passed every probe and serves, but an old one is still there,
      # pinning an instance (and spending the budget) until someone deletes it.
      - name: Report a cleanup failure
        if: ${{ failure() && steps.probe_redirect.outcome == 'success' }}
        run: |
          echo "::error::the new version serves, but other versions remain: delete them with 'gcloud app versions list/delete' (docs/deploy-dashboard.md §10)"
          exit 1
