# Scheduled canary for the PUBLIC API surface (#194; the #148 failure class) and, since
# #277, the public dashboard that reads it.
#
# #148 was a Cloudflare edge setting (Bot Fight Mode) that 403'd every non-browser client
# from a datacenter ASN for 34 days — this repo's CI, and every real consumer of the API
# running on cloud infrastructure. Three things let it survive that long: it was invisible
# from a residential IP, the only client that could see it ran on deploy (roughly monthly),
# and its signal was read as flakiness.
#
# So this job is deliberately the client that was blocked: a GitHub runner (datacenter ASN)
# with curl's own User-Agent, hitting the public hostname through Cloudflare. It asserts
# reachability AND that the origin lock is still enforced, because "the public host returns
# 200" is also exactly what a lock that has fallen open looks like — the pair is the
# evidence, never either half.
#
# Read-only: GET and HEAD requests against the public API and the dashboard, plus the Dash
# routing callback (a POST that renders the page and changes nothing). No secrets, no GCP
# auth, no deploy.
name: API canary (public surface)

on:
  schedule:
    # Daily, deliberately off the top of the hour (GitHub's scheduler is congested there).
    # Daily rather than weekly is a considered trade against D034's scale-to-zero: /health
    # is `no-store`, so each run wakes the origin. One cold start a day is nothing against
    # Cloud Run's free tier, and it buys detection within a day instead of within a deploy.
    - cron: "17 13 * * *"
  workflow_dispatch:

# A queued canary has nothing to add to a running one.
concurrency:
  group: api-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    # Worst cases: each expect_status is 3 tries × 20 s + 2 × 10 s of sleeps (80 s). The
    # API checks through Cloudflare and direct are 5 of them (400 s). The dashboard path
    # is two expect_status calls (160 s) + 12 content tries × 20 s + 11 × 60 s + the 20 s
    # redirect (1080 s). Total ≈ 1480 s ≈ 24.7 min; the dead-man's-switch step adds at
    # most ≈ 87 s (4 tries × 20 s + 7 s of retry backoff), ≈ 26 min in all, under 30. Add
    # a check's 80 s when adding one, and keep the total under the limit.
    timeout-minutes: 30
    # Never checks out, never calls the API — no token needed at all.
    permissions: {}
    # No hostname, no public surface to check (a fresh clone, a fork).
    if: ${{ vars.CLOUDFLARE_HOSTNAME != '' }}
    steps:
      - name: Check the public API
        id: checks
        env:
          CF_HOST: ${{ vars.CLOUDFLARE_HOSTNAME }}
          # Optional: the raw run.app URL, kept in a repo variable rather than tracked
          # here. The origin lock is what protects the origin, not obscurity — but there
          # is no reason to publish the bypass target either.
          RAW_ORIGIN_URL: ${{ vars.RAW_ORIGIN_URL }}
          # The public dashboard (#277) and its App Engine default host.
          EXPLORE_HOST: ${{ vars.EXPLORE_HOSTNAME }}
          EXPLORE_APP_HOST: ${{ vars.EXPLORE_APP_HOSTNAME }}
        run: |
          set -uo pipefail
          # GitHub runs this step under `bash -e`, which ends it at the first failing
          # command. The checks below are collected instead (fail() counts, the tally at
          # the end decides the exit), so -e is switched off for the whole step. `set -u`
          # still ends it on an unbound variable, and the dead-man's switch reports that.
          set +e
          FAILURES=0
          HDR=$(mktemp); BODY=$(mktemp)
          origin_version=""

          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }

          # expect_status <label> <url> <want> [curl option...] — retries, then leaves the
          # last response in $HDR/$BODY for follow-up assertions (with --head, $BODY holds
          # the headers too). Retried because this notifies a human, so one transient blip
          # must not; collected rather than fail-fast, so a single run reports everything
          # that is wrong instead of only the first thing.
          expect_status() {
            local label="$1" url="$2" want="$3" code=""
            local extra=("${@:4}")
            for i in 1 2 3; do
              code=$(curl -sS -o "$BODY" -D "$HDR" -w '%{http_code}' --max-time 20 "${extra[@]}" "$url") || code=000
              if [ "$code" = "$want" ]; then echo "  ✓ ${label}: ${code}"; return 0; fi
              [ "$i" -lt 3 ] && sleep 10
            done
            fail "${label}: got ${code}, want ${want} — ${url}"
            # Untrusted response bytes, dumped through defuse_dump below.
            echo "--- response headers ---"; defuse_dump < "$HDR"
            echo "--- body (first 600 bytes) ---"; head -c 600 "$BODY" | defuse_dump; echo
            return 1
          }

          # Response bytes are untrusted, and the runner parses two workflow-command forms:
          # `::cmd::` at the start of a line (after leading whitespace, which it trims) and
          # the legacy `##[cmd]` anywhere in a line. Both helpers rewrite every run of
          # `#` before `[` to `# [`, which cannot leave a `##[` behind.
          # safe() is for a value printed inside a line its caller starts: stripping CR/LF
          # keeps the value on that line, so it never starts one.
          # Twin: safe() and the Location parse in deploy.yml's post-deploy smoke step.
          safe() { printf '%s' "$1" | tr -d '\r\n' | sed 's/##*\[/# [/g' | head -c 200; }
          # defuse_dump is for printing whole response lines. The runner ends a line at a
          # bare CR as well as at LF, and sed prefixes only after LF, so CRs are stripped
          # first (also before the rewrite, so a CR between `##` and `[` cannot rejoin
          # them). Then the "|" in the prefix (not the indent, which the runner trims)
          # stops a line from starting with `::`.
          defuse_dump() { tr -d '\r' | sed 's/##*\[/# [/g; s/^/    | /'; }

          # The Worker rewrites Host to the raw run.app origin (D035), so any header the
          # app builds from the request's host names that origin. Nothing the public host
          # serves may carry it (D090). Run after every check through Cloudflare.
          no_origin_leak() {
            if grep -qi 'run\.app' "$HDR"; then
              fail "$1: a response header names the raw run.app origin — $(safe "$(grep -i 'run\.app' "$HDR" | head -1)")"
            fi
          }

          echo "=== through Cloudflare (datacenter IP, curl UA — the #148 client) ==="

          # The bare address published posts link (#461): an exact 307 to the relative
          # /docs. The raw header, not curl's %{redirect_url}, which resolves a relative
          # Location to an absolute one and would hide a host leak. Never -L.
          if expect_status "/ → /docs" "https://${CF_HOST}/" 307; then
            # Twin of the Location parse in deploy.yml's expect_location.
            loc=$(tr -d '\r' < "$HDR" | awk 'tolower($1)=="location:"{print $2}')
            [ "$loc" = "/docs" ] \
              || fail "/ redirects to '$(safe "$loc")', want the relative '/docs'"
          fi
          no_origin_leak "/"

          # A 200 whose body is not a JSON object (a Cloudflare challenge page, say) is
          # reported as that, once, and its field checks are skipped: read anyway, they
          # would each name a wrong cause (#526, from #440's review). One parse decides
          # whether the fields are read at all.
          if expect_status "/health" "https://${CF_HOST}/health" 200; then
            if ! jq -e 'type == "object"' "$BODY" >/dev/null 2>&1; then
              fail "/health answered 200 but the body is not a JSON object"
            else
              guard=$(jq -r '.origin_guard // "missing"' "$BODY")
              [ "$guard" = "enforced" ] \
                || fail "origin_guard is '${guard}', want 'enforced' — the /v1 origin lock is open"
              loaded=$(jq -r '.snapshot_loaded // false' "$BODY")
              [ "$loaded" = "true" ] \
                || fail "snapshot_loaded=${loaded} — the service is up but holds no data"
              # /health is `no-store`, so this is always the ORIGIN's answer, never the edge's.
              origin_version=$(jq -r '.snapshot_version // ""' "$BODY")
            fi
          fi
          no_origin_leak "/health"

          # The exact assertion that was 403 for 34 days.
          if expect_status "/v1/meta" "https://${CF_HOST}/v1/meta" 200; then
            grep -qi '^server: cloudflare' "$HDR" \
              || fail "/v1/meta did not traverse Cloudflare (no 'server: cloudflare' header) — DNS or the Worker route may have moved"
            # Headers, so read whatever the body is: a challenge page passes it truthfully.
            # The snapshot comparison below reads the ETag, which a challenge page does not
            # carry, so it sits with the field checks.
            if ! jq -e 'type == "object"' "$BODY" >/dev/null 2>&1; then
              fail "/v1/meta answered 200 but the body is not a JSON object"
            else
              rows=$(jq -r '.row_count // 0' "$BODY")
              [ "$rows" -gt 0 ] 2>/dev/null || fail "row_count=${rows} — the served snapshot is empty"

              # The two ends must agree on which snapshot is live. /v1/meta is edge-cached
              # and its ETag *is* the snapshot content hash, so a mismatch against /health
              # above means the edge holds a version the origin has moved off — a purge
              # that failed, or failed at this colo. The deploy gate checks the purge at
              # cutover (#148) and nothing checks it afterwards, while the edge hold is
              # `s-maxage` 30 days. Deliberately oracle-free: the canary has no expected
              # version, only the requirement that the two ends agree.
              # Strip a weak-validator prefix: Cloudflare rewrites the strong tag to
              # W/"…" whenever it compresses. The value identifies the snapshot; the
              # validator strength does not, and treating W/hash as a mismatch would go
              # red on a healthy API — #148's pathology, rebuilt.
              edge_version=$(tr -d '\r' < "$HDR" | awk 'tolower($1)=="etag:"{gsub(/"/,"",$2); sub(/^W\//,"",$2); print $2}')
              if [ -n "$origin_version" ] && [ "$edge_version" != "$origin_version" ]; then
                fail "the edge is serving snapshot '${edge_version:-none}' but the origin has '${origin_version}' — stale edge cache"
              fi
            fi
          fi
          no_origin_leak "/v1/meta"

          # A real data route, so a reachable API serving a broken snapshot is caught too.
          # 2000 is deliberate and must not be bumped to "the latest election": a historical
          # year is present in every snapshot this API will ever serve, so it cannot drift.
          if expect_status "/v1/elections/2000/summary" "https://${CF_HOST}/v1/elections/2000/summary" 200; then
            n=$(jq -r '.data | length' "$BODY" 2>/dev/null || echo 0)
            [ "$n" -gt 0 ] 2>/dev/null || fail "the 2000 summary returned no rows — reachable, but serving a broken snapshot"
          fi
          no_origin_leak "/v1/elections/2000/summary"

          if [ -n "${RAW_ORIGIN_URL}" ]; then
            echo "=== direct to the origin (no Cloudflare) ==="
            expect_status "raw /v1 origin-lock" "${RAW_ORIGIN_URL}/v1/meta" 403
          else
            # Not a failure (a fork has no origin to check), but not silent either:
            # /health's `origin_guard` is the service reporting the guard is ARMED, which
            # is not evidence it FIRES. Only a request from outside proves that.
            echo "::warning::raw origin-lock check skipped — set the RAW_ORIGIN_URL variable to verify the /v1 lock from outside"
          fi

          # The public dashboard (#277), the API's first consumer. Server-side (D071(d)): it
          # fetches /v1 from App Engine with no Origin header, so there is no CORS
          # allow-list to assert here; #277's browser-side Origin/ACAO check is declined
          # for that reason (docs/deploy-dashboard.md §11).
          if [ -n "${EXPLORE_HOST}" ]; then
            echo "=== the dashboard (https://${EXPLORE_HOST}) ==="
            # The page shell: 200 at the public hostname itself, no redirect, and its
            # canonical link names that hostname.
            if expect_status "dashboard /" "https://${EXPLORE_HOST}/" 200; then
              grep -q "rel=\"canonical\" href=\"https://${EXPLORE_HOST}/\"" "$BODY" \
                || fail "dashboard / has no canonical link to https://${EXPLORE_HOST}/"
            fi

            # No local plotly.js (#430). The app registers plotly.js by its CDN address
            # only, so this path answers 404. A 200 means the running version registers
            # Dash's bundled copy again: a 4.8 MB response anyone can ask for, the largest
            # the site can be made to send. The deploy workflow checks it before traffic
            # moves (#526), but only from #526 on: a rollback deploys an older ref with
            # that ref's own workflow (docs/deploy-dashboard.md §10). This canary runs from
            # main, so it sees the regression whichever ref deployed. HEAD, so a regressed
            # 200 does not download the file on every try.
            expect_status "dashboard plotly.js (#430)" \
              "https://${EXPLORE_HOST}/_dash-component-suites/plotly/package_data/plotly.min.js" \
              404 --head

            # The page content, fetched the way a browser renders it (the Dash Pages
            # routing callback). A 200 alone proves nothing: the degraded page ("the
            # data service isn't responding") is a 200 too. So it must carry a snapshot
            # version, and — once the dashboard's refresher has had time to notice an API
            # deploy (TTL 5 min) — the same version the API's /health reports.
            ROUTING='{"output":".._pages_content.children..._pages_store.data..","outputs":[{"id":"_pages_content","property":"children"},{"id":"_pages_store","property":"data"}],"inputs":[{"id":"_pages_location","property":"pathname","value":"/"},{"id":"_pages_location","property":"search","value":""}],"changedPropIds":["_pages_location.pathname"],"state":[]}'
            dash_ok=0
            for i in $(seq 1 12); do
              # Truncate first: a failed curl must not leave an earlier check's body
              # (which carries the snapshot version too) to be read as this one's.
              : > "$BODY"
              if ! curl -sS -o "$BODY" --max-time 20 -H 'Content-Type: application/json' \
                --data "$ROUTING" "https://${EXPLORE_HOST}/_dash-update-component"; then
                note="the dashboard did not answer (connection or timeout)"
              elif grep -q "isn't responding" "$BODY"; then
                note="degraded (the dashboard cannot read the API)"
              elif [ -n "$origin_version" ] && grep -q "$origin_version" "$BODY"; then
                dash_ok=1; break
              elif [ -z "$origin_version" ] && grep -Eq '[0-9a-f]{64}' "$BODY"; then
                dash_ok=1; break
              else
                note="not serving the API's snapshot ${origin_version:0:12}…"
              fi
              # 12 × 60 s: past two refresher TTLs, so an API deploy mid-run is not a failure.
              [ "$i" -lt 12 ] && sleep 60
            done
            if [ "$dash_ok" -eq 1 ]; then
              echo "  ✓ dashboard content carries the live snapshot"
            else
              fail "dashboard content: ${note:-no response}"
              head -c 600 "$BODY" | defuse_dump; echo
            fi

            # The vendor host must hand visitors to the public hostname.
            if [ -n "${EXPLORE_APP_HOST}" ]; then
              loc=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "https://${EXPLORE_APP_HOST}/") || loc="curl failed"
              [ "$loc" = "301 https://${EXPLORE_HOST}/" ] \
                && echo "  ✓ ${EXPLORE_APP_HOST} → ${EXPLORE_HOST}" \
                || fail "https://${EXPLORE_APP_HOST}/ answered '${loc}', want a 301 to https://${EXPLORE_HOST}/"
            fi
          else
            echo "::warning::dashboard checks skipped — set the EXPLORE_HOSTNAME variable"
          fi

          if [ "$FAILURES" -ne 0 ]; then
            echo "::error::API canary: ${FAILURES} check(s) failed against https://${CF_HOST}"
            exit 1
          fi
          echo "API canary: all checks passed."

      # Dead-man's switch (#197). The checks above detect a broken API; this detects a
      # broken CANARY. Its alerting is otherwise absence-shaped — a canary that stops
      # running looks exactly like one that runs and passes, i.e. like nothing — and
      # GitHub disables `schedule:` workflows after 60 days of repo inactivity, which is
      # precisely the stretch when nobody is checking the API by hand either.
      #
      # The monitor has to live OUTSIDE GitHub Actions. A second scheduled workflow
      # watching this one shares the exact failure mode it is meant to catch: if cron is
      # what broke, both go quiet together and the silence still reads as health.
      #
      # `always()` on purpose, and it is the point rather than a convenience: it fires
      # even when the step above died for a reason that is not an API failure at all —
      # a runner image change, an unbound variable — which converts
      # "the canary quietly broke" into an immediate, specific alert.
      - name: Ping the dead-man's switch
        if: always()
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
          OUTCOME: ${{ steps.checks.outcome }}
        run: |
          set -uo pipefail
          if [ -z "${PING_URL}" ]; then
            echo "::warning::dead-man's switch not armed — HEALTHCHECK_PING_URL is unset, so a canary that stops running would be silent (#197)"
            exit 0
          fi
          # Success pings the base url; a real failure pings /fail. Two distinguishable
          # alerts — "the API is broken" now, and "the canary went quiet" after the
          # grace window — rather than one that means either.
          #
          # cancelled/skipped ping NOTHING. A manual cancel or a `timeout-minutes` fire
          # is a deliberate or infrastructural stop, not evidence about the API, and
          # paging someone with "the API is broken" for it would be a false alarm in the
          # one system whose entire thesis is that false alarms destroy trust in the
          # alarm. Silence is the correct signal there: a one-off is absorbed by the
          # grace window, while a persistent one stops pings altogether and raises the
          # "down" alert on its own — which is exactly what should happen.
          case "${OUTCOME}" in
            success) url="${PING_URL%/}" ;;
            failure) url="${PING_URL%/}/fail" ;;
            *)
              echo "checks outcome '${OUTCOME}' — not pinging; the grace window covers a one-off, and a persistent one raises \"down\" by itself"
              exit 0
              ;;
          esac
          if curl -fsS -m 20 --retry 3 -o /dev/null "$url"; then
            echo "pinged the dead-man's switch (checks: ${OUTCOME})"
          else
            # Never fail the job over the ping: a missing ping IS the alert, so the
            # monitor still fires. Warn so a persistently unreachable monitor — which
            # would page on every run — is attributable.
            echo "::warning::dead-man's switch ping failed (checks: ${OUTCOME}); the monitor will alert on the missing ping, which is the designed fallback"
          fi
