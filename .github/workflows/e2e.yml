name: Dashboard e2e

# The dashboard's browser tests (tests/e2e/, #321; D082), run with Playwright against the
# app served from recorded API responses, so no step reaches the live API. Separate from
# ci.yml because the browser install costs a minute or two, paid only by changes that
# can alter what these tests check: the dashboard, its tests and fixtures, and the
# dependency and interpreter pins. The push:main run mirrors og-card-guard.yml, so a PR
# opened before a path joined this list is still checked once it merges.
#
# Advisory, as every check here: main has no branch protection, so a red run does not
# block a merge (#260).
#
# The browser install is split so a slow package mirror cannot stall the job (#486). The
# headless shell comes from a cache keyed on the installed Playwright version, so a
# version bump in uv.lock changes the key with nothing else to update. It is saved right
# after a download, before the tests, so a failed or cancelled test run still fills it.
# Chromium's system libraries come from apt in a step of their own, after the download,
# bounded by the runner image's apt retry settings and the step's own time cap. Each
# install step and the tests carry a cap, and the caps fire before the job's, so a hang
# fails the step that hung rather than cancelling the job. tests/unit/test_e2e_workflow.py
# guards these properties.

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - "tests/e2e/**"
      - "tests/fixtures/dashboard/**"
      - "tests/dashboard_fixtures.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "tests/e2e/**"
      - "tests/fixtures/dashboard/**"
      - "tests/dashboard_fixtures.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A backstop only: the capped steps below fire first.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      # The runner image (ImageOS, e.g. ubuntu24) joins the cache key, so a cache from one
      # image is never restored onto another. It is read here because the `env` context
      # holds only variables the workflow sets, not the runner's own.
      - name: Read the locked Playwright version and the runner image
        id: playwright
        run: |
          version=$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')
          echo "version=${version:?}" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?}" >> "$GITHUB_OUTPUT"

      # The headless shell only.
      - name: Restore the cached headless shell
        id: chromium-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Download the headless shell
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: uv run playwright install --only-shell chromium

      - name: Save the headless shell
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      # On every run: the cache holds the browser, not the system packages.
      - name: Install Chromium's system libraries
        timeout-minutes: 4
        run: uv run playwright install-deps chromium-headless-shell

      - name: Browser tests (pytest -m e2e)
        timeout-minutes: 8
        run: uv run pytest -m e2e --tracing retain-on-failure

      - name: Upload traces (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
